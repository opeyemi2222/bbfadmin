<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gallery — BBF Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
  <style>
    .gal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
    .gal-thumb {
      background:var(--adm-surface-2); border:1px solid var(--adm-border);
      border-radius:var(--radius-md); overflow:hidden;
      transition:border-color var(--trans-fast), box-shadow var(--trans-fast);
      position:relative;
    }
    .gal-thumb:hover { border-color:var(--adm-border-md); box-shadow:var(--shadow-md); }
    .gal-thumb.pending-item { border-color:rgba(214,158,46,0.4); }
    .gal-thumb-img {
      width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
      background:var(--adm-surface); opacity:.7;
      transition:opacity var(--trans-fast);
    }
    .gal-thumb:hover .gal-thumb-img { opacity:.9; }
    .gal-thumb-placeholder {
      width:100%; aspect-ratio:4/3;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
      background:linear-gradient(135deg,#0a1628,#1a3560);
      color:rgba(201,168,76,.25); font-size:2rem;
    }
    .gal-thumb-body { padding:.85rem 1rem; }
    .gal-thumb-title { font-size:.82rem; font-weight:600; color:var(--adm-text); margin-bottom:.3rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gal-thumb-meta  { font-size:.68rem; color:var(--adm-text-faint); font-family:var(--font-accent); letter-spacing:.04em; margin-bottom:.65rem; }
    .gal-thumb-actions { display:flex; gap:.4rem; }
    .gal-pending-badge {
      position:absolute; top:.5rem; left:.5rem;
      padding:.15rem .55rem; background:rgba(214,158,46,.9);
      border-radius:var(--radius-pill); font-size:.58rem;
      font-family:var(--font-accent); font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; color:#0a1628;
    }
  </style>
</head>
<body>
<div class="adm-shell">
  <div class="adm-sidebar-overlay" id="adm-sidebar-overlay"></div>
  <aside class="adm-sidebar" id="adm-sidebar" role="navigation">
    <a href="index.html" class="adm-sidebar-logo"><div class="adm-logo-badge"><img src="../assets/images/BBF Image.jpeg" alt="BBF Logo" /></div><div class="adm-logo-text"><span class="adm-logo-name">BBF Admin</span><span class="adm-logo-role">Super Admin Panel</span></div></a>
    <div class="adm-sidebar-admin"><div class="adm-admin-avatar"><i class="fas fa-shield-halved"></i></div><div><div class="adm-admin-name" id="adm-admin-name">Super Admin</div><div class="adm-admin-role">Super Admin</div></div></div>
    <nav class="adm-nav">
      <div class="adm-nav-label">Overview</div>
      <a href="index.html" class="adm-nav-item"><i class="fas fa-gauge"></i> Dashboard</a>
      <a href="members.html" class="adm-nav-item"><i class="fas fa-users"></i> Members</a>
      <div class="adm-nav-label">Content</div>
      <a href="events.html" class="adm-nav-item"><i class="fas fa-calendar-alt"></i> Events</a>
      <a href="news.html" class="adm-nav-item"><i class="fas fa-newspaper"></i> News</a>
      <a href="gallery.html" class="adm-nav-item active"><i class="fas fa-images"></i> Gallery</a>
    </nav>
    <div class="adm-sidebar-footer">
      <a href="../index.html" class="adm-back-btn" target="_blank" rel="noopener"><i class="fas fa-globe"></i> View BBF Site</a>
      <button class="adm-logout-btn" id="logout-btn"><i class="fas fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </aside>

  <div class="adm-main">
    <header class="adm-topbar">
      <button class="adm-topbar-toggle" id="adm-sidebar-toggle"><i class="fas fa-bars"></i></button>
      <h1 class="adm-topbar-title">Gallery</h1>
      <div class="adm-topbar-actions">
        <a href="../gallery.html" target="_blank" class="adm-topbar-btn" title="View on site"><i class="fas fa-globe"></i></a>
      </div>
    </header>

    <div class="adm-content">
      <div class="adm-page-head">
        <div><h2>Gallery Management</h2><p>Review pending photos, publish or remove gallery items.</p></div>
        <button class="adm-btn adm-btn-primary" id="add-photo-btn"><i class="fas fa-plus"></i> Add Photo</button>
      </div>

      <!-- Stats -->
      <div class="adm-stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem;" id="gallery-stats"></div>

      <!-- Tabs -->
      <div style="display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap;">
        <button class="adm-btn adm-btn-primary" data-tab="all">All Photos</button>
        <button class="adm-btn adm-btn-ghost" data-tab="pending">Pending Review <span id="pending-count-label"></span></button>
        <button class="adm-btn adm-btn-ghost" data-tab="published">Published</button>
      </div>

      <!-- Filters -->
      <div class="adm-filter-bar">
        <div class="adm-search-wrap">
          <i class="fas fa-search adm-search-icon"></i>
          <input class="adm-search-input" id="gal-search" type="search" placeholder="Search by title…" />
        </div>
        <select class="adm-filter-select" id="gal-cat-filter"><option value="">All Categories</option></select>
      </div>

      <!-- Grid -->
      <div id="gal-grid" class="gal-grid"></div>
      <div id="gal-empty" style="display:none;padding:3rem;text-align:center;color:var(--adm-text-faint);font-size:var(--fs-sm);background:var(--adm-surface);border-radius:var(--radius-lg);border:1px solid var(--adm-border);">
        <i class="fas fa-images" style="font-size:2.5rem;display:block;margin-bottom:1rem;"></i>No photos found.
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Photo Modal -->
<div class="adm-modal-overlay" id="photo-modal" role="dialog" aria-modal="true">
  <div class="adm-modal">
    <div class="adm-modal-header">
      <h3 class="adm-modal-title" id="photo-modal-title">Add Photo</h3>
      <button class="adm-modal-close" onclick="admCloseModal('photo-modal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="adm-modal-body">
      <form id="photo-form" novalidate>
        <div class="adm-field"><label class="adm-label">Title <span style="color:var(--adm-red);">*</span></label><input class="adm-input" id="ph-title" required placeholder="Photo caption / title" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.9rem;">
          <div class="adm-field"><label class="adm-label">Category</label>
            <select class="adm-select" id="ph-category">
              <option>Fellowship</option><option>Community Service</option><option>Training</option>
              <option>Social</option><option>Parade</option><option>Outreach</option>
            </select>
          </div>
          <div class="adm-field"><label class="adm-label">Year</label>
            <input class="adm-input" type="number" id="ph-year" value="2026" min="2020" max="2099" />
          </div>
          <div class="adm-field" style="grid-column:1/-1;"><label class="adm-label">Uploaded By</label><input class="adm-input" id="ph-uploader" placeholder="BBF Media" /></div>
          <div class="adm-field" style="grid-column:1/-1;"><label class="adm-label">Image File <span id="ph-file-label" style="color:var(--adm-text-faint);font-size:.65rem;">(required for new photos)</span></label><input class="adm-input" type="file" id="ph-file" name="image" accept="image/jpeg,image/png,image/webp" style="padding:.45rem .9rem;" /></div>
          <div class="adm-field" style="grid-column:1/-1;"><label class="adm-label">Image URL / Path <span style="color:var(--adm-text-faint);font-size:.65rem;">(or paste URL)</span></label><input class="adm-input" id="ph-image" placeholder="assets/images/photo.jpg or https://…" /></div>
          <div class="adm-field"><label class="adm-label">Status</label>
            <select class="adm-select" id="ph-status"><option value="published">Published</option><option value="pending">Pending</option></select>
          </div>
        </div>
        <input type="hidden" id="ph-id" />
      </form>
    </div>
    <div class="adm-modal-footer">
      <button class="adm-btn adm-btn-ghost" onclick="admCloseModal('photo-modal')">Cancel</button>
      <button class="adm-btn adm-btn-primary" id="photo-save-btn"><i class="fas fa-floppy-disk"></i> Save</button>
    </div>
  </div>
</div>

<div class="adm-toast-container" id="adm-toast-container"></div>
<div class="adm-confirm" id="adm-confirm" role="alertdialog">
  <div class="adm-confirm-box">
    <div class="adm-confirm-icon" id="adm-confirm-icon">⚠️</div>
    <div class="adm-confirm-title" id="adm-confirm-title">Confirm</div>
    <div class="adm-confirm-msg" id="adm-confirm-msg"></div>
    <div class="adm-confirm-btns"><button class="adm-btn adm-btn-ghost" id="adm-confirm-cancel">Cancel</button><button class="adm-btn adm-btn-danger" id="adm-confirm-ok">Confirm</button></div>
  </div>
</div>

<script src="assets/js/admin-data.js"></script>
<script>
  // Handle redirect from auth.php
  (function() {
    const p = new URLSearchParams(window.location.search).get('login');
    if (p) { try { sessionStorage.setItem('bbf_admin_logged_in','true'); sessionStorage.setItem('bbf_admin',JSON.stringify(JSON.parse(decodeURIComponent(p)))); window.history.replaceState({},'',window.location.pathname); } catch(e){} }
  })();
  admAuthGuard(); admInitSidebar();
  document.getElementById('adm-admin-name').textContent = JSON.parse(sessionStorage.getItem('bbf_admin')||'{}').name||'Super Admin';
  document.getElementById('logout-btn').addEventListener('click', admLogout);

  const API = '../api/admin/gallery.php';
  let photos = [], activeTab = 'all', searchVal = '', catVal = '';

  async function loadPhotos() {
    document.getElementById('gal-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--adm-text-faint);"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
    try {
      const params = new URLSearchParams();
      if (activeTab !== 'all') params.set('status', activeTab);
      if (catVal)    params.set('category', catVal);
      if (searchVal) params.set('q', searchVal);
      const res  = await admFetch(`${API}?${params}`, { credentials:'include' });
      const data = await res.json();
      if (!data.success) { if (res.status===401) { admLogout(); return; } admToast(data.message,'error'); return; }
      photos = data.data || [];
      renderStats(); renderGrid(); populateCatFilter();
    } catch(e) { admToast('Could not load gallery.','error'); }
  }

  function populateCatFilter() {
    const cf = document.getElementById('gal-cat-filter'); const cur = cf.value;
    while (cf.options.length > 1) cf.remove(1);
    [...new Set(photos.map(g=>g.category).filter(Boolean))].sort()
      .forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cf.appendChild(o); });
    cf.value = cur;
  }

  function renderStats() {
    const total=photos.length, pub=photos.filter(g=>g.status==='published').length,
          pending=photos.filter(g=>g.status==='pending').length,
          catCount=new Set(photos.map(g=>g.category)).size;
    document.getElementById('gallery-stats').innerHTML = [
      {cls:'gold',icon:'fa-images',      val:total,   lbl:'Total Photos'},
      {cls:'green',icon:'fa-check-circle',val:pub,    lbl:'Published'},
      {cls:'amber',icon:'fa-clock',       val:pending, lbl:'Pending Review'},
      {cls:'blue', icon:'fa-tags',        val:catCount,lbl:'Categories'},
    ].map(s=>`<div class="adm-stat-card"><div class="adm-stat-icon ${s.cls}"><i class="fas ${s.icon}"></i></div><div><div class="adm-stat-val">${s.val}</div><div class="adm-stat-lbl">${s.lbl}</div></div></div>`).join('');
    const pl = document.getElementById('pending-count-label');
    if (pl) pl.textContent = pending > 0 ? `(${pending})` : '';
  }

  function isPlaceholder(p) { return !p || p.includes('placeholder'); }

  function renderGrid() {
    const grid=document.getElementById('gal-grid'), empty=document.getElementById('gal-empty');
    if (!photos.length) { grid.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    grid.innerHTML = photos.map(g=>`
      <div class="gal-thumb ${g.status==='pending'?'pending-item':''}">
        ${g.status==='pending'?'<span class="gal-pending-badge">Pending</span>':''}
        ${isPlaceholder(g.image)
          ? `<div class="gal-thumb-placeholder"><i class="fas fa-image"></i></div>`
          : `<img src="${g.image}" alt="${g.title}" class="gal-thumb-img" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
             <div class="gal-thumb-placeholder" style="display:none;"><i class="fas fa-image"></i></div>`}
        <div class="gal-thumb-body">
          <div class="gal-thumb-title" title="${g.title}">${g.title}</div>
          <div class="gal-thumb-meta">${g.category} · ${g.year||''} · ${g.uploadedBy||''}</div>
          <div class="gal-thumb-actions">
            ${g.status==='pending'?`<button class="adm-btn adm-btn-success adm-btn-sm" onclick="approvePhoto(${g.id})"><i class="fas fa-check"></i> Approve</button>`:''}
            <button class="adm-btn adm-btn-ghost adm-btn-sm" onclick="editPhoto(${g.id})"><i class="fas fa-pen"></i></button>
            <button class="adm-btn adm-btn-danger adm-btn-sm" onclick="removePhoto(${g.id})"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>`).join('');
  }

  function approvePhoto(id) {
    admConfirm('Approve Photo','Publish this photo to the public gallery?', async ()=>{
      const res = await admFetch(`${API}?id=${id}`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'approve'})});
      const data = await res.json();
      if (data.success) { admToast('Photo published.','success'); loadPhotos(); }
      else admToast(data.message,'error');
    }, false);
  }

  function editPhoto(id) {
    const g = photos.find(x=>x.id===id); if(!g) return;
    document.getElementById('photo-modal-title').textContent = 'Edit Photo';
    document.getElementById('ph-id').value       = g.id;
    document.getElementById('ph-title').value    = g.title;
    document.getElementById('ph-category').value = g.category;
    document.getElementById('ph-year').value     = g.year||new Date().getFullYear();
    document.getElementById('ph-uploader').value = g.uploadedBy||'';
    document.getElementById('ph-image').value    = g.image||'';
    document.getElementById('ph-status').value   = g.status;
    admOpenModal('photo-modal');
  }

  function removePhoto(id) {
    admConfirm('Remove Photo','Permanently remove this photo?', async ()=>{
      const res = await admFetch(`${API}?id=${id}`,{method:'DELETE',credentials:'include'});
      const data = await res.json();
      if (data.success) { admToast('Photo removed.','error'); loadPhotos(); }
      else admToast(data.message,'error');
    }, true);
  }

  document.getElementById('add-photo-btn').addEventListener('click', ()=>{
    document.getElementById('photo-modal-title').textContent = 'Add Photo';
    document.getElementById('photo-form').reset();
    document.getElementById('ph-id').value = '';
    document.getElementById('ph-year').value = new Date().getFullYear();
    admOpenModal('photo-modal');
  });

  document.getElementById('photo-save-btn').addEventListener('click', async ()=>{
    const title = document.getElementById('ph-title').value.trim();
    if (!title) { admToast('Title is required.','error'); return; }
    const id = document.getElementById('ph-id').value;
    // Use FormData for file upload support
    const fd = new FormData();
    fd.append('title',      title);
    fd.append('category',   document.getElementById('ph-category').value);
    fd.append('year',       document.getElementById('ph-year').value);
    fd.append('uploadedBy', document.getElementById('ph-uploader').value||'Admin');
    fd.append('status',     document.getElementById('ph-status').value);
    const fileInput = document.getElementById('ph-file');
    if (fileInput?.files[0]) fd.append('image', fileInput.files[0]);
    else if (!id) { admToast('Please select an image file.','error'); return; }

    const btn = document.getElementById('photo-save-btn');
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving…';
    try {
      const url = id ? `${API}?id=${id}` : API;
      // If editing without new file, use JSON PATCH
      let res;
      if (id && !fileInput?.files[0]) {
        res = await admFetch(url,{method:'POST',credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({title,category:fd.get('category'),year:fd.get('year'),status:fd.get('status')})});
      } else {
        res = await admFetch(url,{method:'POST',credentials:'include',body:fd});
      }
      const data = await res.json();
      if (data.success) { admToast(id?'Photo updated.':'Photo added.','success'); admCloseModal('photo-modal'); loadPhotos(); }
      else admToast(data.message||'Save failed.','error');
    } catch(e) { admToast('Could not connect.','error'); }
    finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-floppy-disk"></i> Save'; }
  });

  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeTab=btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b=>b.className='adm-btn adm-btn-ghost');
      btn.className='adm-btn adm-btn-primary';
      loadPhotos();
    });
  });
  document.getElementById('gal-search').addEventListener('input', admDebounce(e=>{ searchVal=e.target.value; loadPhotos(); }));
  document.getElementById('gal-cat-filter').addEventListener('change', e=>{ catVal=e.target.value; loadPhotos(); });

  loadPhotos();
</script>
</body>
</html>
